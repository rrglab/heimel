name: Public release verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify public release evidence
        run: python conformance/verify_public_release.py
      - name: Verify conformance runner semantics
        run: python conformance/test_run_conformance.py
      - name: Verify public reference adapter
        run: python reference/test_adapter.py
      - name: Run v0.2.0 reference conformance
        run: |
          python conformance/run_conformance.py \
            --adapter "python reference/adapter.py" \
            --implementation "heimel-public-reference-adapter/0.2.0" \
            --configuration-digest "dce8fdff9757e9092583d45b7d3a8f2b139532d838332fcc974e84a971e4a870" \
            --output /tmp/reference-conformance.json
      - name: Verify formal authority models
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            --output /tmp/tla2tools.jar
          # Verified against upstream v1.8.0 release SHA-1 (0b57675323babad8ab3815b1db9f30e75dac1cdb) on 2026-11-13.
          echo 'e1f11b75c4b5bc4478ba0ac5cb6ae28e40a01b0016bc33e0aa97da22dfdbcd7f  /tmp/tla2tools.jar' | sha256sum --check
          (
            cd spec/formal
            java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC -cleanup ConsequenceBoundary.tla -config ConsequenceBoundary.cfg
            java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC -cleanup AuthorityConfinement.tla -config AuthorityConfinement.cfg
          )
      - name: Reject obvious secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|aws_secret_access_key|client_secret[[:space:]]*[:=]|api[_-]?key[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_/-]{16,}|token[[:space:]]*[:=][[:space:]]*[A-Za-z0-9_/-]{20,})' -- ':!conformance/verify_public_release.py' ':!.github/workflows/public-release-verification.yml'; then
            echo 'Potential secret material detected'
            exit 1
          fi
      - name: Assert no private-source dependency
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E '(checkout|clone|fetch).*(valo|private)|github\.com/.*/valo' -- 'conformance/**' 'reference/**' ':!conformance/verify_public_release.py'; then
            echo 'Public verification code must not access private source'
            exit 1
          fi
